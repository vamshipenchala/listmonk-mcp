# Lock 2 of 2: only Anthropic's outbound ranges reach the MCP server.
# Source: https://platform.claude.com/docs/en/api/ip-addresses
# (Lock 1 is the secret URL path, enforced inside the container.)
server {
    listen 80;
    server_name mcp.destinyaiastrology.com;

    # Let's Encrypt must reach this from anywhere, for issuance and renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        allow 160.79.104.0/21;
        allow 153.61.208.0/20;
        deny  all;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP streams responses as server-sent events
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
